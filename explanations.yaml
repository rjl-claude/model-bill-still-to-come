- check: LCCC
  line: CfD renewables
  period: "2026-10 to 2027-03"
  gap: model 2.28 x LCCC (cash)
  explanation: >
    Market price. LCCC forecasts on market prices (Winter 2026 baseload reference price £114.50/MWh cash,
    docs/facts.md 21); the model uses Annex M (2026: £75.3/MWh, 2027: £62.7/MWh, 2024 prices), as ruled.
    Run at £114.50 cash for 2026 and 2027, the model is within 7% of LCCC (model 0.93 x LCCC).
