# Written explanations for checks over the 15% margin (build plan point 14). One entry per check, line and period;
# read by billtocome.checks; a gap over 15% without an entry fails the build. Every entry goes into Annex E.
# Re-derived 5 Nov 2026 (aios-harness#80): the 'price that matches' is found by running the CfD lines at two
# flat market prices (£60 and £120/MWh, 2024 prices) and solving the straight line for the reference figure.
- check: OBR
  line: CfD
  period: "2026"
  gap: model 1.75 x OBR (calendarised, cash)
  explanation: >
    Market price. The model prices power on DESNZ Annex M (2026: £75.3/MWh, 2024 prices), as ruled
    (ADR 0003, point 26); the OBR prices on the market. The model meets the OBR's 2026 figure at a
    market price of about £109.6/MWh (2024 prices), all else unchanged.
- check: OBR
  line: CfD
  period: "2027"
  gap: model 2.54 x OBR (calendarised, cash)
  explanation: >
    Market price. The model prices power on DESNZ Annex M (2027: £62.7/MWh, 2024 prices), as ruled
    (ADR 0003, point 26); the OBR prices on the market. The model meets the OBR's 2027 figure at a
    market price of about £99.3/MWh (2024 prices), all else unchanged.
