    (ADR 0003, point 26); the OBR prices on the market. The model meets the OBR's 2028 figure at a
    market price of about £75.4/MWh (2024 prices), all else unchanged. Contracts not yet built are 12% of the model's 2028;
    a slower build than LCCC's expected dates in the OBR's forecast would close part of the gap instead.
